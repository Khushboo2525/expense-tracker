{% extends 'base.html' %}

{% block title %}Register - Spendwise{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-4">
            <div class="card shadow-sm p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-shield-check text-success" style="font-size: 2.5rem;"></i>
                    <h4 class="mt-2 fw-semibold">Create account</h4>
                    <p class="text-muted small">Start tracking your expenses</p>
                </div>

                <div id="error-msg" class="alert alert-danger d-none"></div>
                <div id="success-msg" class="alert alert-success d-none"></div>

                <div class="mb-3">
                    <label class="form-label small text-muted">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="johndoe">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">Email</label>
                    <input type="email" id="email" class="form-control" placeholder="you@gmail.com">
                </div>
                <div class="mb-3">
                    <label class="form-label small text-muted">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••">
                </div>
                <button class="btn btn-primary w-100" onclick="register()">
                    <span id="btn-text">Create account</span>
                </button>

                <p class="text-center mt-3 small text-muted">
                    Already have an account? <a href="/login/" class="text-success">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (getToken()) window.location.href = '/dashboard/';

    async function register() {
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorMsg = document.getElementById('error-msg');
        const successMsg = document.getElementById('success-msg');
        const btnText = document.getElementById('btn-text');

        if (!username || !email || !password) {
            errorMsg.textContent = 'Please fill in all fields';
            errorMsg.classList.remove('d-none');
            return;
        }

        btnText.textContent = 'Creating account...';

        try {
            const response = await fetch(`${API_BASE}/users/register/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('access_token', data.access);
                localStorage.setItem('refresh_token', data.refresh);
                localStorage.setItem('user', JSON.stringify(data.user));
                successMsg.textContent = 'Account created! Redirecting...';
                successMsg.classList.remove('d-none');
                setTimeout(() => window.location.href = '/dashboard/', 1000);
            } else {
                const errors = Object.values(data).flat().join(' ');
                errorMsg.textContent = errors || 'Registration failed';
                errorMsg.classList.remove('d-none');
                btnText.textContent = 'Create account';
            }
        } catch (err) {
            errorMsg.textContent = 'Something went wrong. Please try again.';
            errorMsg.classList.remove('d-none');
            btnText.textContent = 'Create account';
        }
    }

    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') register();
    });
</script>
{% endblock %}
